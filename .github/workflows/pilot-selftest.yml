name: Founder test checks

# Runs made up conversations against the founder test preview and posts what the server did on the pull request.
# It speaks only for a made up resident. It holds no secret. The preview accepts it because GitHub signs a token
# that names this repository and this branch.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'A JSON list of steps. A step is a path under /api/pilot/, or an object with who, say, fresh.'
        required: true
        default: '["health?db=0"]'
      label:
        description: 'A short name for this run'
        required: false
        default: 'run'
  push:
    branches: [pilot/founder-test]
    paths:
      - '.github/workflows/pilot-selftest.yml'
      - 'tests/pilot/hosted/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: founder-test-checks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/pilot/hosted/run.mjs
        env:
          PREVIEW: https://deploy-preview-19--universecitystage.netlify.app
          PULL_REQUEST: '19'
          STEPS: ${{ github.event.inputs.steps }}
          LABEL: ${{ github.event.inputs.label }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
