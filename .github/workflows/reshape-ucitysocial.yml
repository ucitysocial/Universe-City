name: Reshape ucitysocial public site

on:
  push:
    branches:
      - site/refine-language-product

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run requested site structure pass' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
          persist-credentials: true
          fetch-depth: 0

      - name: Apply requested public-site changes
        run: python scripts/reshape_ucitysocial.py

      - name: Commit requested structure pass
        run: |
          set -euo pipefail
          rm -f scripts/reshape_ucitysocial.py
          rm -f .github/workflows/reshape-ucitysocial.yml
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git add -A ucitysocial scripts .github/workflows/reshape-ucitysocial.yml
          git commit -m 'site: move founder up and replace department wheel'
          git push origin HEAD:site/refine-language-product
