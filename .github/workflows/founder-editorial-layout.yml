name: Founder editorial layout
on:
  push:
    branches: [site/founder-typesetting-cleanup]
    paths: ['.github/workflows/founder-editorial-layout.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/founder-typesetting-cleanup
          fetch-depth: 0
      - name: Apply editorial layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ucitysocial/founder.html')
          s=p.read_text()
          css=r'''
/* ===== Founder editorial reading layout ===== */
:root{--reading:Georgia,"Times New Roman",serif}
.page{padding:54px 64px 64px!important}
.page-inner{max-width:34rem!important;margin:0!important;transform-origin:top left}
.chapter{margin:0 0 24px!important;padding:0 0 9px!important;border-bottom:1px solid rgba(20,10,12,.16)!important;font-size:10px!important;line-height:1.2!important;letter-spacing:.18em!important}
.page h2{max-width:17ch!important;margin:0 0 28px!important;font-size:clamp(30px,2.35vw,38px)!important;line-height:1.08!important;letter-spacing:-.025em!important;font-weight:700!important;text-wrap:balance}
.page p{font-family:var(--reading)!important;max-width:60ch!important;margin:0 0 1.05em!important;font-size:17px!important;line-height:1.55!important;letter-spacing:0!important;text-indent:0!important}
.page .lead{font-family:var(--reading)!important;max-width:56ch!important;margin:0 0 1.15em!important;padding:0!important;border:0!important;font-size:19px!important;line-height:1.5!important;font-weight:400!important;font-style:italic!important;text-indent:0!important}
.pull{font-family:var(--reading)!important;max-width:54ch!important;margin:28px 0 0!important;padding:17px 0 0!important;border-top:1px solid rgba(20,10,12,.38)!important;border-left:0!important;font-size:20px!important;line-height:1.4!important;letter-spacing:0!important;font-weight:600!important}
.page-no{font-size:10px!important;letter-spacing:.12em!important;bottom:18px!important}
.left .page-no{left:24px!important}.right .page-no{right:24px!important}
.cover .page-inner{max-width:none!important;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.cover h2{font-family:var(--sans)!important;max-width:8ch!important;margin:0!important;font-size:clamp(44px,4.6vw,66px)!important;line-height:1!important}
.cover .coverline{font-family:var(--sans)!important;font-size:clamp(22px,2vw,30px)!important;line-height:1.15!important;font-style:normal!important}
@media(max-width:760px){
  .page{padding:18px 20px 36px!important}
  .page-inner{max-width:none!important}
  .chapter{margin:0 0 12px!important;padding-bottom:7px!important;font-size:8.5px!important}
  .page h2{max-width:18ch!important;margin:0 0 14px!important;font-size:clamp(23px,6vw,29px)!important;line-height:1.08!important}
  .page p{max-width:none!important;margin-bottom:.8em!important;font-size:clamp(12.5px,3.35vw,14.5px)!important;line-height:1.48!important}
  .page .lead{max-width:none!important;margin-bottom:.9em!important;font-size:clamp(14px,3.7vw,16px)!important;line-height:1.42!important}
  .pull{max-width:none!important;margin-top:14px!important;padding-top:10px!important;font-size:clamp(15px,4vw,18px)!important;line-height:1.32!important}
  .cover h2{font-size:clamp(34px,9.5vw,46px)!important}
}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git rm .github/workflows/founder-editorial-layout.yml
          git add ucitysocial/founder.html
          git commit -m 'site: refine founder editorial layout'
          git push origin HEAD:site/founder-typesetting-cleanup
