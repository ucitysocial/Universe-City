name: Founder typography cleanup v2

on:
  push:
    branches:
      - site/founder-typesetting-cleanup
    paths:
      - '.github/workflows/founder-typesetting-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/founder-typesetting-cleanup
          fetch-depth: 0
      - name: Apply CSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          payload=''
          css=zlib.decompress(base64.b64decode(payload)).decode()
          p=Path('ucitysocial/founder.html')
          s=p.read_text()
          if 'Founder book editorial typesetting cleanup' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
          grep -q "Founder book editorial typesetting cleanup" ucitysocial/founder.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git rm -f .github/workflows/founder-typesetting-cleanup.yml .github/workflows/founder-typesetting-cleanup-v2.yml
          git add ucitysocial/founder.html
          git commit -m 'site: clean founder book typography'
          git push origin HEAD:site/founder-typesetting-cleanup
