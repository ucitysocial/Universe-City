name: Apply refined ucitysocial source

on:
  push:
    branches:
      - site/refine-language-product

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply refined ucitysocial source' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
          persist-credentials: true
          fetch-depth: 0

      - name: Replace static pages
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ucity-refined-xz.b64.part* | base64 -d > /tmp/ucity-refined.tar.xz
          tar -xJf /tmp/ucity-refined.tar.xz -C ucitysocial
          grep -qi "Each folder starts differently" ucitysocial/index.html
          grep -qi '\$12 a week. One membership.' ucitysocial/index.html
          ! grep -Rqi "One month, one part of your life" ucitysocial/*.html
          ! grep -Rqi "Agency Assessment comes first" ucitysocial/*.html

      - name: Commit refined site
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/ucity-refined-xz.b64.part*
          rm -f scripts/ucitysocial-language.patch.gz.b64.part*
          rm -f .github/workflows/apply-ucitysocial-language.yml
          rm -f .github/workflows/apply-refined-ucitysocial.yml
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git add -A ucitysocial scripts .github/workflows/apply-ucitysocial-language.yml .github/workflows/apply-refined-ucitysocial.yml
          git commit -m 'copy: refine ucitysocial product story and language'
          git push origin HEAD:site/refine-language-product
