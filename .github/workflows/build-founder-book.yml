name: Build founder book

on:
  push:
    branches:
      - site/refine-language-product

permissions:
  contents: write

jobs:
  build:
    if: "${{ github.event.head_commit.message == 'chore: run founder book build' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
          persist-credentials: true
          fetch-depth: 0
      - name: Build founder book
        run: python scripts/build-founder-book.py
      - name: Verify founder book
        run: |
          grep -q "Losing my guiding light" ucitysocial/founder.html
          grep -q "Universe big. City small." ucitysocial/founder.html
          grep -q "turn-sheet" ucitysocial/founder.html
      - name: Commit founder book
        run: |
          rm -f scripts/founder-book-note.txt scripts/founder-book-temp.txt
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git add ucitysocial/founder.html scripts .github/workflows/build-founder-book.yml
          git commit -m 'site: turn founder story into interactive book'
          git push origin HEAD:site/refine-language-product
