name: Widen founder story headlines

on:
  push:
    branches:
      - site/founder-typesetting-cleanup
    paths:
      - '.github/workflows/widen-founder-headlines.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/founder-typesetting-cleanup
          fetch-depth: 0

      - name: Widen article headlines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ucitysocial/founder.html')
          s = p.read_text()
          old_desktop = '.page h2{font-family:var(--ui);font-size:clamp(30px,2.45vw,40px);line-height:1.08;letter-spacing:-.028em;margin:0 0 25px;max-width:18ch;text-wrap:balance}'
          new_desktop = '.page h2{font-family:var(--ui);font-size:clamp(28px,2.2vw,36px);line-height:1.12;letter-spacing:-.025em;margin:0 0 25px;max-width:none;width:100%;text-wrap:pretty}'
          old_mobile = '.page h2{font-size:clamp(23px,6.2vw,29px);line-height:1.08;margin-bottom:13px;max-width:19ch}'
          new_mobile = '.page h2{font-size:clamp(22px,5.8vw,28px);line-height:1.1;margin-bottom:13px;max-width:none;width:100%}'
          if old_desktop not in s:
              raise SystemExit('desktop headline rule not found')
          if old_mobile not in s:
              raise SystemExit('mobile headline rule not found')
          s = s.replace(old_desktop, new_desktop, 1)
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s)
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git rm .github/workflows/widen-founder-headlines.yml
          git add ucitysocial/founder.html
          git commit -m 'site: widen founder story headlines'
          git push origin HEAD:site/founder-typesetting-cleanup
