name: Fix founder book and homepage story

on:
  push:
    branches:
      - site/refine-language-product
    paths:
      - '.github/workflows/fix-founder-book-home.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
          fetch-depth: 0

      - name: Fix homepage founder story and founder book
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('ucitysocial/index.html')
          s=p.read_text()
          old='''   <p class="lead rv d2 mt3">My mom handled parts of everyday life with me before I knew how to manage them myself.</p><p class="rv d2">She died in 2016. Afterward, I understood how much administrative work she had been doing with me.</p>\n   <p class="rv d2">Universe City is designed to provide that kind of structure without trying to replace the relationship.</p>\n   <p class="rv d2 px">Universe City provides life management. It does not provide therapy or case management.</p>'''
          new='''   <p class="lead rv d2 mt3">I lost my mom suddenly in 2016. I was 20, heading into 21, and I lost my guiding light.</p>\n   <p class="rv d2">She was the person I could call, fall back on, move back in with, love and hug. She had known me from the beginning of time. Losing her meant realizing I would now be responsible for understanding myself as fully as she had.</p>\n   <p class="rv d2">I had to learn how to manage my time, money, goals, priorities and standards while creating a direction of my own. I knew I could not be the only person who felt overwhelmed by the ordinary work of adulthood.</p>\n   <p class="rv d2 px">Universe City grew from years of asking what makes life easier to manage, what people should understand before adulthood, and how those responsibilities can be organized into something usable.</p>'''
          if old not in s:
              raise SystemExit('Homepage founder story block not found')
          p.write_text(s.replace(old,new))

          p=Path('ucitysocial/founder.html')
          s=p.read_text()
          overrides='''\n/* Founder book stability pass */\n.page-inner{transform-origin:top left;will-change:transform}\n.book.turn-next .page,.book.turn-prev .page{animation:none!important;opacity:1!important;transform:none!important}\n.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:50%;background:linear-gradient(90deg,var(--paper),var(--paper2));z-index:40;pointer-events:none;opacity:0;transform-style:preserve-3d;backface-visibility:hidden}\n.book.turn-next::after{transform-origin:left center;animation:ucSheetNext .36s cubic-bezier(.45,.02,.18,1)}\n.book.turn-prev::after{left:0;transform-origin:right center;animation:ucSheetPrev .36s cubic-bezier(.45,.02,.18,1)}\n@keyframes ucSheetNext{0%{opacity:0;transform:perspective(1400px) rotateY(0)}8%{opacity:1}100%{opacity:1;transform:perspective(1400px) rotateY(-179deg)}}\n@keyframes ucSheetPrev{0%{opacity:0;transform:perspective(1400px) rotateY(0)}8%{opacity:1}100%{opacity:1;transform:perspective(1400px) rotateY(179deg)}}\n@media(max-width:760px){\nhtml,body{height:100%;overflow:hidden}.sitebar{height:56px;position:relative}.shell{height:calc(100svh - 56px);width:calc(100% - 14px);margin:0 auto;padding:8px 0 6px;display:flex;flex-direction:column;overflow:hidden}.book-kicker{display:none}.book-head{min-height:38px;flex:0 0 38px;margin:0;justify-content:center}.book-head h1{font-size:18px;line-height:1.1;margin:0}.book-head p{display:none!important}.book-wrap{flex:1 1 auto;min-height:0;overflow:hidden}.book{height:100%!important;min-height:0!important;max-height:none!important;display:block;overflow:hidden}.book::before{display:none}.book::after{left:0;width:100%}.page{height:100%!important;min-height:0!important;padding:18px 18px 36px!important;overflow:hidden!important}.page.left{display:none!important}.page.right{display:block!important;border:0}.page h2{font-size:clamp(22px,6.8vw,31px)!important;line-height:1.02;margin-bottom:10px}.page p{font-size:clamp(11px,3.15vw,14px)!important;line-height:1.42!important;margin-bottom:8px!important}.page .lead{font-size:clamp(14px,4vw,18px)!important;line-height:1.3!important}.chapter{font-size:9px!important;margin-bottom:9px!important}.pull{font-size:clamp(16px,4.5vw,21px)!important;line-height:1.2;margin:11px 0!important;padding-top:9px!important}.photo{max-height:27%!important;width:100%;object-fit:cover;margin:3px 0 8px!important}.caption{font-size:9px!important;line-height:1.25;margin:-4px 0 8px!important}.page-no{bottom:10px!important}.controls{height:38px;flex:0 0 38px;padding:4px 0 0!important;align-items:center}.controls button{min-height:32px;padding:6px 10px;font-size:11px}.edge{height:62px!important;width:38px!important}}\n'''
          s=s.replace('</style>',overrides+'\n</style>',1)
          s=s.replace('''return `<div class="chapter">${p.chapter}</div>\n      <h2>${p.title}</h2>\n      ${p.html}\n      <div class="page-no">${String(n).padStart(2,"0")} / ${pages.length}</div>`;''','''return `<div class="page-inner"><div class="chapter">${p.chapter}</div>\n      <h2>${p.title}</h2>\n      ${p.html}</div>\n      <div class="page-no">${String(n).padStart(2,"0")} / ${pages.length}</div>`;''')
          marker='  function render(){'
          fitter='''  function fitPage(el){\n    const inner=el.querySelector(".page-inner");\n    if(!inner) return;\n    inner.style.transform="";inner.style.width="100%";\n    const available=Math.max(1,el.clientHeight-34);\n    const needed=inner.scrollHeight;\n    if(needed>available){const scale=Math.max(.68,Math.min(1,available/needed));inner.style.transform=`scale(${scale})`;inner.style.width=`${100/scale}%`;}\n  }\n\n'''
          s=s.replace(marker,fitter+marker,1)
          s=s.replace('''      next.textContent = mobilePage === pages.length - 1 ? "End" : "Turn page";\n      return;''','''      next.textContent = mobilePage === pages.length - 1 ? "End" : "Turn page";\n      requestAnimationFrame(()=>fitPage(right));\n      return;''')
          s=s.replace('''    next.textContent = next.disabled ? "End" : "Turn page";\n  }''','''    next.textContent = next.disabled ? "End" : "Turn page";\n    requestAnimationFrame(()=>{fitPage(left);fitPage(right)});\n  }''')
          s=s.replace('}, 130);','}, 175);').replace('}, 300);','}, 380);')
          p.write_text(s)
          PY

          grep -q "I lost my mom suddenly in 2016" ucitysocial/index.html
          grep -q "function fitPage" ucitysocial/founder.html
          grep -q "100svh" ucitysocial/founder.html
          grep -q "ucSheetNext" ucitysocial/founder.html

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git rm .github/workflows/fix-founder-book-home.yml
          git add ucitysocial/index.html ucitysocial/founder.html
          git commit -m 'site: fix founder book and story'
          git push origin HEAD:site/refine-language-product
