name: Diagnose founder interaction payload

on:
  push:
    branches:
      - site/refine-language-product
    paths:
      - 'scripts/founder-v2.xz.b64.part*'
      - '.github/workflows/apply-founder-v2.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
      - name: Check payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c scripts/founder-v2.xz.b64.part*
          sha256sum scripts/founder-v2.xz.b64.part*
          cat scripts/founder-v2.xz.b64.part* > /tmp/all.b64
          sha256sum /tmp/all.b64
