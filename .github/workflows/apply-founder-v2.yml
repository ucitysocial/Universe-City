name: Apply founder interaction v2

on:
  push:
    branches:
      - site/refine-language-product
    paths:
      - 'scripts/founder-v2.xz.b64.part*'
      - '.github/workflows/apply-founder-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'site: improve founder page-turn interaction') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site/refine-language-product
          fetch-depth: 0

      - name: Rebuild founder page
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/founder-v2.xz.b64.part* | base64 -d > /tmp/founder-v2.html.xz
          xz -dc /tmp/founder-v2.html.xz > ucitysocial/founder.html
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ucitysocial/founder.html','utf8');
          const scripts=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          for (const x of scripts) new Function(x);
          if(!s.includes('id="edgeNext"') || !s.includes('pointerdown')) throw new Error('Founder interaction update missing');
          NODE
          rm -f scripts/founder-v2.xz.b64.part* .github/workflows/apply-founder-v2.yml

      - name: Commit founder interaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ucitysocial'
          git config user.email 'media@babs.fm'
          git add ucitysocial/founder.html scripts .github/workflows/apply-founder-v2.yml
          git commit -m 'site: improve founder page-turn interaction'
          git push origin HEAD:site/refine-language-product
